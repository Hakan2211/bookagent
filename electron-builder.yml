appId: com.kitapmi.app
productName: Kitapmi
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - "!out/**/*.map"

# Publish to GitHub Releases
publish:
  provider: github
  owner: Hakan2211
  repo: bookagent
  releaseType: release

mac:
  category: public.app-category.productivity
  identity: null
  forceCodeSigning: false
  target:
    - target: dmg
      arch: [universal]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Hyphenated name so the uploaded asset matches the url in latest.yml (GitHub turns spaces into dots).
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
