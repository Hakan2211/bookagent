appId: com.kitapmi.app
productName: Kitapmi
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - "!out/**/*.map"

# Publish to GitHub Releases
publish:
  provider: github
  owner: Hakan2211
  repo: bookagent
  releaseType: draft

mac:
  category: public.app-category.productivity
  identity: null
  forceCodeSigning: false
  target:
    - target: dmg
      arch: [universal]

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
